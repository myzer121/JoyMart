# 大富翁 (Monopoly) configuration
# icon.material       : Material shown for this game in the JoyMart GUI
# cost                : Economy cost to play (0 = free)
# settings.startMoney : In-game starting money per player
# settings.passGoBonus: Money collected when passing GO
# settings.jailFee    : Fee to pay to leave jail
# properties          : List of buyable properties (name, price, rent)
#                       Admin can edit prices and rents here or via the
#                       in-game settings editor GUI.

icon:
  material: GOLD_BLOCK

cost: 0.0

settings:
  startMoney: 2000
  passGoBonus: 200
  jailFee: 50

rewards:
  winner:
    tokens: 10
    money: 0.0
    commands: []
  loser:
    tokens: 2
    money: 0.0
    commands: []
  draw:
    tokens: 3
    money: 0.0

# 17 properties laid out around the 26-space board.
# Board positions (clockwise from GO):
#   0=GO, 8=Jail, 13=FreeParking, 19=GoToJail (corners)
#   4,15,21=Chance  2,11=CommunityChest
#   Properties occupy the remaining 17 positions:
#   1,3,5,6,7,9,10,12,14,16,17,18,20,22,23,24,25
